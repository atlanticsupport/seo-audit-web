<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>SEO Audit</title>
  <meta name="description" content="Auditoria técnica, ranking e concorrência SEO.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header class="topbar">
      <form id="audit-form">
        <label class="sr-only" for="url">URL do site</label>
        <input id="url" name="url" type="text" inputmode="url" autocomplete="url" placeholder="exemplo.com" required>
        <button class="primary" type="submit" aria-label="Analisar" title="Analisar">
          <svg viewBox="0 0 353.332 353.332" aria-hidden="true"><path d="M85.831 210h60a15 15 0 0 0 0-30h-60a15 15 0 0 0 0 30Z"/><path d="m348.107 327.725-30.938-30.938a73.1 73.1 0 0 0 11.995-40.121c0-35.297-25.068-64.844-58.334-71.786V125a15 15 0 0 0-4.393-10.607l-110-110A15 15 0 0 0 145.831 0h-130a15 15 0 0 0-15 15v300a15 15 0 0 0 15 15h240a72.9 72.9 0 0 0 40.127-11.998l30.937 30.936a15 15 0 1 0 21.212-21.213Zm-48.942-71.059A43.334 43.334 0 1 1 255.831 213.332a43.383 43.383 0 0 1 43.334 43.334ZM160.831 51.213 219.618 110h-58.787V51.213ZM30.831 30h100v95a15 15 0 0 0 15 15h95v44.88c-27.862 5.814-49.953 27.493-56.4 55.12h-98.6a15 15 0 0 0 0 30h97.903a72.8 72.8 0 0 0 12.983 30H30.831V30Z"/></svg>
        </button>
      </form>
      <nav class="actions" aria-label="Integrações e relatório">
        <button id="gsc-connect" class="gsc-button" type="button" aria-label="Ligar Google Search Console" title="Ligar Google Search Console"><img src="/gsc.png" alt=""></button>
        <a id="download-report" class="icon-button" aria-label="Descarregar relatório completo" title="Descarregar relatório completo" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 1.25a.75.75 0 0 0-.75.75v10.973L9.57 11.012a.75.75 0 1 0-1.14.976l3 3.5a.75.75 0 0 0 1.14 0l3-3.5a.75.75 0 1 0-1.14-.976l-1.68 1.96V2a.75.75 0 0 0-.75-.75Z"/><path d="M14.25 9v.378a2.25 2.25 0 0 1 2.458 3.586l-3 3.5a2.25 2.25 0 0 1-3.416 0l-3-3.5A2.25 2.25 0 0 1 9.75 9.378V9H8c-2.828 0-4.243 0-5.121.879C2 10.757 2 12.172 2 15v1c0 2.828 0 4.243.879 5.121C3.757 22 5.172 22 8 22h8c2.828 0 4.243 0 5.121-.879C22 20.243 22 18.828 22 16v-1c0-2.828 0-4.243-.879-5.121C20.243 9 18.828 9 16 9h-1.75Z"/></svg>
        </a>
      </nav>
    </header>

    <p id="notice" class="notice" aria-live="polite" hidden></p>
    <div id="workspace" class="workspace">
      <div class="content">
        <details id="opportunities" class="rank-section"><summary><strong>Plano de melhoria</strong><small>Por analisar</small></summary><div class="rank-content"></div></details>
        <details id="rankings" class="rank-section"><summary><strong>Posições</strong><small>Por analisar</small></summary><div class="rank-content"></div></details>
        <details id="competitors" class="rank-section"><summary><strong>Concorrentes</strong><small>Por analisar</small></summary><div class="rank-content"></div></details>
        <section id="results" class="results" aria-label="Resultados técnicos"></section>
      </div>

      <aside class="dashboard" aria-label="Resumo visual">
        <section class="panel health-panel">
          <div id="health-donut" class="donut" style="--value:0"><span>—</span></div>
          <div><strong>Saúde técnica</strong><small id="health-copy">Por analisar</small></div>
        </section>
        <section class="panel">
          <div class="panel-title"><strong>Pesquisa orgânica</strong><small id="gsc-period">Não ligado</small></div>
          <div class="kpis">
            <div><span id="kpi-clicks">—</span><small>Cliques</small></div>
            <div><span id="kpi-impressions">—</span><small>Impressões</small></div>
            <div><span id="kpi-ctr">—</span><small>CTR</small></div>
            <div><span id="kpi-position">—</span><small>Posição</small></div>
          </div>
          <svg id="trend-chart" class="trend-chart" viewBox="0 0 420 120" role="img" aria-label="Evolução diária"><path class="grid" d="M0 30H420M0 60H420M0 90H420"/><polyline points=""/></svg>
        </section>
        <section class="panel">
          <div class="panel-title"><strong>Distribuição de posições</strong><small id="ranked-count">Por analisar</small></div>
          <div id="rank-bars" class="bars"></div>
        </section>
        <section class="panel">
          <div class="panel-title"><strong>Visibilidade concorrente</strong><small id="competitor-count">Por analisar</small></div>
          <div id="competitor-bars" class="bars"></div>
        </section>
      </aside>
    </div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
