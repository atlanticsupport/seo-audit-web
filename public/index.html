<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>SEO Audit</title>
  <meta name="description" content="Verificador técnico SEO.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <form id="audit-form">
      <label class="sr-only" for="url">URL do site</label>
      <div class="url-entry">
        <input id="url" name="url" type="text" inputmode="url" autocomplete="url" placeholder="exemplo.com" required>
        <button type="submit">Analisar</button>
      </div>
    </form>

    <section id="summary" class="summary" aria-live="polite" hidden></section>
    <section id="results" class="results" aria-label="Resultados da auditoria"></section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
