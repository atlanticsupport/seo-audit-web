<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>SEO Audit</title>
  <meta name="description" content="Auditoria técnica, ranking e concorrência SEO.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header class="topbar">
      <form id="audit-form">
        <label class="sr-only" for="url">URL do site</label>
        <input id="url" name="url" type="text" inputmode="url" autocomplete="url" placeholder="exemplo.com" required>
        <select id="market" aria-label="Mercado">
          <option value="pt">Portugal</option>
          <option value="es">Espanha</option>
        </select>
        <button class="primary" type="submit">Analisar</button>
      </form>
      <nav class="actions" aria-label="Integrações e relatório">
        <button id="gsc-connect" class="text-button" type="button">Ligar GSC</button>
        <details class="settings">
          <summary aria-label="Definições de ranking" title="Definições de ranking">•••</summary>
          <div class="settings-panel">
            <label for="serper-key">Chave Serper</label>
            <input id="serper-key" type="password" autocomplete="off" placeholder="Opcional se configurada no servidor">
            <small>Usada só nesta sessão para resultados Google reais. <a href="https://serper.dev/" target="_blank" rel="noopener">Criar grátis</a>.</small>
          </div>
        </details>
        <a id="download-report" class="icon-button" aria-label="Descarregar relatório completo" title="Descarregar relatório completo" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 1.25a.75.75 0 0 0-.75.75v10.973L9.57 11.012a.75.75 0 1 0-1.14.976l3 3.5a.75.75 0 0 0 1.14 0l3-3.5a.75.75 0 1 0-1.14-.976l-1.68 1.96V2a.75.75 0 0 0-.75-.75Z"/><path d="M14.25 9v.378a2.25 2.25 0 0 1 2.458 3.586l-3 3.5a2.25 2.25 0 0 1-3.416 0l-3-3.5A2.25 2.25 0 0 1 9.75 9.378V9H8c-2.828 0-4.243 0-5.121.879C2 10.757 2 12.172 2 15v1c0 2.828 0 4.243.879 5.121C3.757 22 5.172 22 8 22h8c2.828 0 4.243 0 5.121-.879C22 20.243 22 18.828 22 16v-1c0-2.828 0-4.243-.879-5.121C20.243 9 18.828 9 16 9h-1.75Z"/></svg>
        </a>
      </nav>
    </header>

    <p id="notice" class="notice" aria-live="polite" hidden></p>
    <div id="workspace" class="workspace" hidden>
      <div class="content">
        <section id="opportunities" class="rank-section" hidden></section>
        <section id="rankings" class="rank-section" hidden></section>
        <section id="competitors" class="rank-section" hidden></section>
        <section id="results" class="results" aria-label="Resultados técnicos"></section>
      </div>

      <aside class="dashboard" aria-label="Resumo visual">
        <section class="panel health-panel">
          <div id="health-donut" class="donut" style="--value:0"><span>—</span></div>
          <div><strong>Saúde técnica</strong><small id="health-copy">A analisar</small></div>
        </section>
        <section class="panel">
          <div class="panel-title"><strong>Pesquisa orgânica</strong><small id="gsc-period">GSC não ligado</small></div>
          <div class="kpis">
            <div><span id="kpi-clicks">—</span><small>Cliques</small></div>
            <div><span id="kpi-impressions">—</span><small>Impressões</small></div>
            <div><span id="kpi-ctr">—</span><small>CTR</small></div>
            <div><span id="kpi-position">—</span><small>Posição</small></div>
          </div>
          <svg id="trend-chart" class="trend-chart" viewBox="0 0 420 120" role="img" aria-label="Evolução diária"><path class="grid" d="M0 30H420M0 60H420M0 90H420"/><polyline points=""/></svg>
        </section>
        <section class="panel">
          <div class="panel-title"><strong>Distribuição de posições</strong><small id="ranked-count">Sem pesquisas</small></div>
          <div id="rank-bars" class="bars"></div>
        </section>
        <section class="panel">
          <div class="panel-title"><strong>Visibilidade concorrente</strong><small>Top orgânico ponderado</small></div>
          <div id="competitor-bars" class="bars"></div>
        </section>
      </aside>
    </div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
